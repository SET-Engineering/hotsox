<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HotSox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060808;
      --panel: #101618;
      --panel2: #0a0f11;
      --line: #263238;
      --line2: #1c262a;
      --orange: #ff8a00;
      --cyan: #74e7f1;
      --text: #e6eef0;
      --muted: #7b8a91;
      --bad: #ff8b73;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Gill Sans", "Gill Sans MT", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(255,138,0,.023) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,138,0,.023) 1px, transparent 1px),
        radial-gradient(circle at 8% 0%, rgba(255,138,0,.12), transparent 34%),
        radial-gradient(circle at 92% 4%, rgba(0,185,208,.08), transparent 30%),
        var(--bg);
      background-size: 52px 52px, 52px 52px, auto, auto, auto;
      touch-action: manipulation;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 7px 8px 16px; }
    .top { display: flex; align-items: center; gap: 10px; padding: 5px 0 8px; border-bottom: 1px solid var(--line); }
    .logo { height: 38px; width: auto; display:block; filter: drop-shadow(0 0 10px rgba(255,255,255,.10)); }
    .logotxt { color:white; font-weight:900; font-size:20px; }
    .brand { color: var(--orange); font-weight: 900; font-size: 13px; line-height: 1; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel { position: relative; margin-top: 7px; padding: 8px; border: 1px solid var(--line); background: linear-gradient(90deg, rgba(255,138,0,.06), transparent 35%), var(--panel); }
    .panel::before { content:""; position:absolute; left:-1px; top:-1px; width:36%; height:2px; background:var(--orange); box-shadow:0 0 9px rgba(255,138,0,.35); }
    .title { display:flex; align-items:center; gap:7px; margin-bottom:6px; color:var(--orange); font-weight:900; font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
    .title::after { content:""; flex:1; height:1px; background:var(--line); }
    .row { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
    button {
      appearance:none; border:1px solid var(--line); border-radius:0; background:#0b1012; color:var(--muted);
      min-height:29px; min-width:34px; padding:5px 7px; font:inherit; font-size:10px; font-weight:900; letter-spacing:.07em; text-transform:uppercase;
    }
    button:active { transform: translateY(1px); color:var(--orange); border-color:var(--orange); background:#141009; }
    button.hot { color:var(--orange); border-color:rgba(255,138,0,.65); }
    button.bad { color:var(--bad); border-color:rgba(255,139,115,.65); }
    button.on { color:var(--cyan); border-color:rgba(116,231,241,.65); box-shadow:0 0 10px rgba(116,231,241,.08); }
    .metrics { display:grid; grid-template-columns: repeat(6, 1fr); gap:5px; margin-top:7px; }
    .metric { border:1px solid var(--line2); background:var(--panel2); padding:6px 5px; min-width:0; }
    .lab { color:var(--muted); font-size:8px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .val { margin-top:2px; color:var(--cyan); font-size:14px; line-height:1; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .val.hot { color:var(--orange); } .val.bad { color:var(--bad); }
    .zones { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .zone { border:1px solid var(--line2); background:#0a0f11; padding:6px; min-width:0; }
    .zone.active { border-color:rgba(116,231,241,.62); box-shadow:inset 0 0 0 1px rgba(116,231,241,.08); }
    .zone.hot { border-color:rgba(255,138,0,.72); box-shadow:inset 0 0 0 1px rgba(255,138,0,.10); }
    .zhead { display:flex; justify-content:space-between; gap:6px; align-items:baseline; margin-bottom:4px; }
    .zn { color:var(--orange); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.14em; white-space:nowrap; }
    .zv { color:var(--cyan); font-size:13px; font-weight:900; white-space:nowrap; }
    .zm { color:var(--muted); font-size:8px; font-weight:900; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
    .zbtns { display:grid; grid-template-columns: repeat(5,1fr); gap:3px; }
    .zbtns button { min-width:0; padding:5px 3px; }
    .foot { display:grid; grid-template-columns:auto repeat(3,1fr); gap:4px; align-items:stretch; }
    .fl { display:flex; align-items:center; color:var(--orange); font-size:10px; font-weight:900; letter-spacing:.13em; text-transform:uppercase; padding-right:3px; min-width:22px; }
    input { flex:1; min-width:100px; min-height:29px; border:1px solid var(--line); border-radius:0; background:#070a0b; color:var(--cyan); padding:5px 7px; font:inherit; font-size:11px; font-weight:900; text-transform:uppercase; }
    .reply { margin-top:5px; color:var(--muted); font-size:10px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    pre { margin:0; height:58px; overflow:hidden; white-space:pre; color:#9ca8ad; font-family:Consolas, Menlo, monospace; font-size:7.5px; line-height:1.35; }
    @media (max-width:430px) {
      .wrap { padding:6px 7px 14px; } .logo { height:34px; } .brand { font-size:12px; letter-spacing:.17em; }
      .metrics { grid-template-columns: repeat(3, 1fr); } .val { font-size:13px; }
      button { font-size:9.5px; min-height:28px; padding:5px 5px; } .zones { gap:5px; } .zone { padding:5px; }
      .zn { font-size:9.5px; letter-spacing:.10em; } .zv { font-size:12px; }
    }
  </style>
</head>

      <div class="title">Link</div>
      <div class="row">
        <button id="connectButton" class="hot" onclick="toggleConnection()">Connect</button>
        <button class="bad" onclick="sendCmd('OFF')">Off</button>
        <button onclick="sendCmd('SCAN')">Scan</button>

      <div class="metric"><div class="lab">V</div><div class="val" id="busV">--</div></div>
      <div class="metric"><div class="lab">A filt</div><div class="val" id="currentA">--</div></div>
      <div class="metric"><div class="lab">A raw</div><div class="val" id="rawA">--</div></div>
      <div class="metric"><div class="lab">W</div><div class="val" id="powerW">--</div></div>
      <div class="metric"><div class="lab">Lim</div><div class="val hot" id="lim">--</div></div>
      <div class="metric"><div class="lab">F</div><div class="val hot" id="fault">--</div></div>

      <div class="title">Zones</div>
      <div class="zones">
        <div class="zone" id="zoneLS"><div class="zhead"><div class="zn">L sole</div><div class="zv" id="ls">--</div></div><div class="zm" id="lsMeta">--</div><div class="zbtns"><button onclick="sendCmd('LS=0')">0</button><button onclick="sendCmd('LS=10')">10</button><button onclick="sendCmd('LS=25')">25</button><button onclick="sendCmd('LS=40')">40</button><button onclick="sendCmd('LS=100')">100</button></div></div>
        <div class="zone" id="zoneLT"><div class="zhead"><div class="zn">L toe</div><div class="zv" id="lt">--</div></div><div class="zm" id="ltMeta">--</div><div class="zbtns"><button onclick="sendCmd('LT=0')">0</button><button onclick="sendCmd('LT=10')">10</button><button onclick="sendCmd('LT=25')">25</button><button onclick="sendCmd('LT=40')">40</button><button onclick="sendCmd('LT=100')">100</button></div></div>
        <div class="zone" id="zoneRS"><div class="zhead"><div class="zn">R sole</div><div class="zv" id="rs">--</div></div><div class="zm" id="rsMeta">--</div><div class="zbtns"><button onclick="sendCmd('RS=0')">0</button><button onclick="sendCmd('RS=10')">10</button><button onclick="sendCmd('RS=25')">25</button><button onclick="sendCmd('RS=40')">40</button><button onclick="sendCmd('RS=100')">100</button></div></div>
        <div class="zone" id="zoneRT"><div class="zhead"><div class="zn">R toe</div><div class="zv" id="rt">--</div></div><div class="zm" id="rtMeta">--</div><div class="zbtns"><button onclick="sendCmd('RT=0')">0</button><button onclick="sendCmd('RT=10')">10</button><button onclick="sendCmd('RT=25')">25</button><button onclick="sendCmd('RT=40')">40</button><button onclick="sendCmd('RT=100')">100</button></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="title">Modes</div>
      <div class="foot">
        <div class="fl">L</div><button onclick="sendCmd('LO')">Off</button><button onclick="sendCmd('LM')">M</button><button onclick="sendCmd('LH')">H</button>
        <div class="fl">R</div><button onclick="sendCmd('RO')">Off</button><button onclick="sendCmd('RM')">M</button><button onclick="sendCmd('RH')">H</button>
        <div class="fl">A</div><button onclick="sendCmd('AO')">Off</button><button onclick="sendCmd('AM')">M</button><button onclick="sendCmd('AH')">H</button>
      </div>
    </div>

    <div class="panel">
      <div class="title">Manual / raw</div>
      <div class="row"><input id="cmd" value="?" autocomplete="off" autocapitalize="characters"><button onclick="sendManual()">Send</button></div>
      <div style="height:6px"></div>
      <pre id="raw">--</pre>
    </div>
  </div>

<script>
const SERVICE_UUID = "6f4c0001-b5a3-f393-e0a9-e50e24dcca9e";
const CONTROL_UUID = "6f4c0002-b5a3-f393-e0a9-e50e24dcca9e";
const TELEMETRY_UUID = "6f4c0003-b5a3-f393-e0a9-e50e24dcca9e";
let device = null, controlChar = null, telemetryChar = null;
let rawLines = [];
function el(id) { return document.getElementById(id); }
function setText(id, text) { el(id).textContent = text; }
function setButtonConnected(on) { const b=el('connectButton'); b.textContent = on ? 'Connected' : 'Connect'; b.className = on ? 'on' : 'hot'; }
async function toggleConnection() {
  if (device && device.gatt && device.gatt.connected) { device.gatt.disconnect(); return; }
  await connectHotSox();
}
async function connectHotSox() {
  try {
    if (!navigator.bluetooth) { setText('reply','No Web BLE'); setText('raw','Use Chrome on Android from HTTPS.'); return; }
    el('connectButton').textContent = 'Choosing';
    device = await navigator.bluetooth.requestDevice({ filters:[{namePrefix:'HotSox'}], optionalServices:[SERVICE_UUID] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    el('connectButton').textContent = 'Joining';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    controlChar = await service.getCharacteristic(CONTROL_UUID);
    telemetryChar = await service.getCharacteristic(TELEMETRY_UUID);
    telemetryChar.addEventListener('characteristicvaluechanged', onTelemetry);
    await telemetryChar.startNotifications();
    setButtonConnected(true);
    await sendCmd('?');
  } catch (err) { setButtonConnected(false); setText('reply', String(err)); setText('raw', String(err)); }
}
function onDisconnected() { controlChar=null; telemetryChar=null; setButtonConnected(false); setText('reply','Disconnected'); }
async function sendManual() { await sendCmd(el('cmd').value); }
async function sendCmd(cmd) {
  if (!controlChar) { setText('reply','Not connected'); return; }
  await controlChar.writeValue(new TextEncoder().encode(cmd));
  setText('reply','sent ' + cmd);
}
function onTelemetry(event) { parseTelemetry(new TextDecoder().decode(event.target.value)); }
function split4(v, fallback) { return (v || fallback).split('/'); }
function parseTelemetry(s) {
  rawLines.push(s); rawLines = rawLines.slice(-5); setText('raw', rawLines.join('\n'));
  const data = {};
  for (const p of s.split(',')) { const eq=p.indexOf('='); if (eq>0) data[p.slice(0,eq)] = p.slice(eq+1); }
  if (data.V !== undefined) setText('busV', fmt(data.V,2));
  if (data.I !== undefined) setText('currentA', fmt(data.I,3));
  if (data.IR !== undefined) setText('rawA', fmt(data.IR,3)); else if (data.I !== undefined) setText('rawA', fmt(data.I,3));
  if (data.P !== undefined) setText('powerW', fmt(data.P,2));
  if (data.LIM !== undefined) setText('lim', Math.round(Number(data.LIM)*100) + '%');
  if (data.F !== undefined) { setText('fault', data.F); el('fault').className = data.F === '0' ? 'val hot' : 'val bad'; }
  if (data.R !== undefined) setText('reply', data.R);
  const d = split4(data.D, '---/---/---/---');
  const rq = split4(data.RQ || data.REQ, d.join('/'));
  const m = split4(data.M, '-/-/-/-');
  const z = split4(data.Z, '?/?/?/?');
  const a = split4(data.A, '-/-/-/-');
  const x = split4(data.X, '-/-/-/-');
  updateZone('LS','ls','lsMeta',d[0],rq[0],m[0],z[0],a[0],x[0]);
  updateZone('LT','lt','ltMeta',d[1],rq[1],m[1],z[1],a[1],x[1]);
  updateZone('RS','rs','rsMeta',d[2],rq[2],m[2],z[2],a[2],x[2]);
  updateZone('RT','rt','rtMeta',d[3],rq[3],m[3],z[3],a[3],x[3]);
}
function fmt(v,n) { const x=Number(v); return Number.isNaN(x) ? '--' : x.toFixed(n); }
function updateZone(id, valId, metaId, duty, req, mode, inst, amps, sub) {
  const dn = Number(duty); const rn = Number(req);
  setText(valId, duty + '/' + req + ' ' + mode);
  const ztxt = inst === '1' ? 'IN' : (inst === '0' ? 'OUT' : '??');
  setText(metaId, ztxt + ' A' + amps + ' X' + sub);
  const card = el('zone' + id); card.className = 'zone';
  const active = (!Number.isNaN(dn) && dn > 0) || (!Number.isNaN(rn) && rn > 0);
  if (active) card.classList.add((dn >= 40 || mode === 'H') ? 'hot' : 'active');
}
setButtonConnected(false);
if (!navigator.bluetooth) { setText('reply','No Web BLE'); setText('raw','Use Chrome on Android from HTTPS.'); }
</script>
</body>
</html>
