<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HotSox Controller</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #16161a;
      --panel-2: #202027;
      --line: #33333d;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --good: #38d982;
      --warn: #ffbb33;
      --bad: #ff5c70;
      --accent: #7c8cff;
      --accent-2: #a3b0ff;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 10px;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .topbar,
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .topbar {
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subbrand {
      color: var(--muted);
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .button-row {
      display: grid;
      gap: 7px;
    }

    .button-row.connection {
      grid-template-columns: 1.25fr 1fr;
    }

    .button-row.modes {
      grid-template-columns: repeat(4, 1fr);
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 10px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button:hover {
      border-color: #4c4c59;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1022;
    }

    button.primary:hover {
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    button.mode.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1022;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
    }

    .mini-button {
      min-height: 30px;
      padding: 0 9px;
      font-size: 0.78rem;
      border-radius: 10px;
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    .dot.good {
      background: var(--good);
      box-shadow: 0 0 10px rgba(56, 217, 130, 0.58);
    }

    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 10px rgba(255, 187, 51, 0.58);
    }

    .dot.bad {
      background: var(--bad);
      box-shadow: 0 0 10px rgba(255, 92, 112, 0.58);
    }

    .card {
      padding: 10px 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      min-height: 60px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 0.67rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .metric .value {
      font-size: 1.28rem;
      line-height: 1;
      font-weight: 760;
      letter-spacing: -0.03em;
    }

    .metric .value.small {
      font-size: 0.98rem;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .control-grid {
      display: grid;
      gap: 8px;
    }

    .state-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .state-box {
      min-height: 46px;
      padding: 7px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .state-label {
      color: var(--muted);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .state-value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 740;
      min-width: 0;
    }

    .raw {
      margin-top: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: #0d0d11;
      border: 1px solid var(--line);
      color: #d4d4d8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.76rem;
      word-break: break-all;
    }

    .log {
      height: 178px;
      overflow: auto;
      padding: 8px 9px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0d0d11;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.73rem;
      line-height: 1.35;
    }

    .log-entry {
      margin: 0 0 5px;
      color: #d4d4d8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-entry.good {
      color: #b6f3d1;
    }

    .log-entry.warn {
      color: #ffe0a1;
    }

    .log-entry.bad {
      color: #ffb0bc;
    }

    @media (min-width: 620px) {
      body {
        padding: 14px;
      }

      .dashboard-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div class="brand-row">
        <div class="brand">
          <h1>HotSox</h1>
          <div class="subbrand">SET prototype BLE controller</div>
        </div>
      </div>

      <div class="button-row connection">
        <button id="connectButton" class="primary">Connect</button>
        <button id="disconnectButton" disabled>Disconnect</button>
      </div>

      <div class="status-strip">
        <div id="connectionPill" class="pill">
          <span id="connectionDot" class="dot bad"></span>
          <span id="connectionText">Disconnected</span>
        </div>

        <div id="deviceName" class="pill">No device</div>

        <div id="detectedPill" class="pill">
          <span id="detectedDot" class="dot"></span>
          <span id="detectedText">Heater ?</span>
        </div>

        <div id="outputPill" class="pill">
          <span id="outputDot" class="dot"></span>
          <span id="outputText">Output —</span>
        </div>
      </div>
    </section>

    <section class="card control-grid">
      <div class="section-head">
        <h2>Heat mode</h2>
        <button id="readStatusButton" class="mini-button" disabled>Read status</button>
      </div>

      <div class="button-row modes">
        <button class="mode" data-mode="0" disabled>OFF</button>
        <button class="mode" data-mode="1" disabled>LOW</button>
        <button class="mode" data-mode="2" disabled>MED</button>
        <button class="mode" data-mode="3" disabled>HIGH</button>
      </div>

      <div class="state-row">
        <div class="state-box">
          <div class="state-label">Mode</div>
          <div id="modeValue" class="state-value">—</div>
        </div>

        <div class="state-box">
          <div class="state-label">INA</div>
          <div id="inaValue" class="state-value">—</div>
        </div>

        <div class="state-box">
          <div class="state-label">Packet</div>
          <div id="rawShortValue" class="state-value">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Electrical status</h2>
      </div>

      <div class="dashboard-grid">
        <div class="metric">
          <div class="label">Current</div>
          <div id="currentValue" class="value">—</div>
        </div>

        <div class="metric">
          <div class="label">Bus voltage</div>
          <div id="voltageValue" class="value">—</div>
        </div>

        <div class="metric">
          <div class="label">Approx. power</div>
          <div id="powerValue" class="value">—</div>
        </div>

        <div class="metric">
          <div class="label">Raw status packet</div>
          <div id="rawPacket" class="value small">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Event log</h2>
        <button id="clearLogButton" class="mini-button">Clear</button>
      </div>

      <div id="log" class="log"></div>
    </section>
  </main>

  <script>
    const SERVICE_UUID = 'f05a0001-5eed-4a55-beef-534554485368';
    const MODE_UUID    = 'f05a0002-5eed-4a55-beef-534554485368';
    const STATUS_UUID  = 'f05a0003-5eed-4a55-beef-534554485368';

    const MODE_NAMES = ['OFF', 'LOW', 'MED', 'HIGH'];

    let bluetoothDevice = null;
    let gattServer = null;
    let hotsoxService = null;
    let modeCharacteristic = null;
    let statusCharacteristic = null;

    let connected = false;
    let lastStatus = null;

    const $ = (id) => document.getElementById(id);

    function timestamp() {
      return new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function log(message, level = '') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${level}`.trim();
      entry.textContent = `[${timestamp()}] ${message}`;

      const logBox = $('log');
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setConnectedUi(isConnected) {
      connected = isConnected;

      $('connectButton').disabled = isConnected;
      $('disconnectButton').disabled = !isConnected;
      $('readStatusButton').disabled = !isConnected;

      document.querySelectorAll('button.mode').forEach((button) => {
        button.disabled = !isConnected;
      });

      $('connectionText').textContent = isConnected ? 'Connected' : 'Disconnected';
      $('connectionDot').className = `dot ${isConnected ? 'good' : 'bad'}`;

      if (!isConnected) {
        $('deviceName').textContent = bluetoothDevice?.name || 'No device';
      }
    }

    function formatPacket(dataView) {
      const bytes = [];
      for (let i = 0; i < dataView.byteLength; i++) {
        bytes.push(dataView.getUint8(i).toString(16).padStart(2, '0').toUpperCase());
      }
      return bytes.join('-');
    }

    function decodeStatus(dataView) {
      if (dataView.byteLength < 6) {
        throw new Error(`Status packet too short: ${dataView.byteLength} bytes`);
      }

      const flags = dataView.getUint8(0);
      const mode = dataView.getUint8(1);
      const currentMa = dataView.getUint16(2, true);
      const busMv = dataView.getUint16(4, true);

      return {
        raw: formatPacket(dataView),
        detected: Boolean(flags & 0x01),
        heatModeSelected: Boolean(flags & 0x02),
        outputOn: Boolean(flags & 0x04),
        inaValid: Boolean(flags & 0x08),
        mode,
        modeName: MODE_NAMES[mode] ?? `UNKNOWN(${mode})`,
        currentMa,
        busMv,
        busV: busMv / 1000,
        powerW: (currentMa * busMv) / 1000000
      };
    }

    function setActiveModeButton(mode) {
      document.querySelectorAll('button.mode').forEach((button) => {
        button.classList.toggle('active', Number(button.dataset.mode) === mode);
      });
    }

    function updateStatusUi(status) {
      const previous = lastStatus;
      lastStatus = status;

      $('detectedText').textContent = status.detected ? 'Heater detected' : 'Heater absent';
      $('detectedDot').className = `dot ${status.detected ? 'good' : 'bad'}`;

      $('outputText').textContent = status.outputOn ? 'Output ON' : 'Output OFF';
      $('outputDot').className = `dot ${status.outputOn ? 'warn' : ''}`.trim();

      $('modeValue').textContent = status.modeName;
      setActiveModeButton(status.mode);

      $('inaValue').textContent = status.inaValid ? 'Valid' : 'Invalid';

      $('currentValue').textContent = `${status.currentMa} mA`;
      $('voltageValue').textContent = `${status.busV.toFixed(3)} V`;
      $('powerValue').textContent = `${status.powerW.toFixed(2)} W`;

      $('rawPacket').textContent = status.raw;
      $('rawShortValue').textContent = status.raw.slice(0, 5);

      if (previous) {
        if (previous.detected !== status.detected) {
          log(
            status.detected ? 'Heater detected.' : 'Heater no longer detected.',
            status.detected ? 'good' : 'bad'
          );
        }

        if (previous.mode !== status.mode) {
          log(`Mode changed: ${previous.modeName} → ${status.modeName}.`, 'good');
        }

        if (previous.outputOn !== status.outputOn) {
          log(`Output ${status.outputOn ? 'ON' : 'OFF'}.`);
        }
      }
    }

    function handleStatusValue(dataView, source = 'status') {
      try {
        const status = decodeStatus(dataView);
        updateStatusUi(status);
        log(
          `${source}: ${status.raw} | ${status.modeName}, ` +
          `${status.currentMa} mA, ${status.busV.toFixed(3)} V`
        );
      } catch (error) {
        log(`Failed to decode status: ${error.message}`, 'bad');
      }
    }

    async function connectHotSox() {
      if (!navigator.bluetooth) {
        log('This browser does not expose Web Bluetooth.', 'bad');
        return;
      }

      try {
        log('Opening Bluetooth picker...');

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'HotSox' }],
          optionalServices: [SERVICE_UUID]
        });

        $('deviceName').textContent = bluetoothDevice.name || 'Unnamed BLE device';
        log(`Selected ${bluetoothDevice.name || 'unnamed device'}. Connecting...`);

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        gattServer = await bluetoothDevice.gatt.connect();
        hotsoxService = await gattServer.getPrimaryService(SERVICE_UUID);
        modeCharacteristic = await hotsoxService.getCharacteristic(MODE_UUID);
        statusCharacteristic = await hotsoxService.getCharacteristic(STATUS_UUID);

        await statusCharacteristic.startNotifications();
        statusCharacteristic.addEventListener(
          'characteristicvaluechanged',
          onStatusNotification
        );

        setConnectedUi(true);
        log('Connected. Live notifications enabled.', 'good');

        const initialStatus = await statusCharacteristic.readValue();
        handleStatusValue(initialStatus, 'initial');
      } catch (error) {
        log(`Connection failed: ${error.message}`, 'bad');
        setConnectedUi(false);
      }
    }

    function onDisconnected() {
      setConnectedUi(false);
      log('Bluetooth disconnected.', 'warn');
    }

    function disconnectHotSox() {
      if (bluetoothDevice?.gatt?.connected) {
        bluetoothDevice.gatt.disconnect();
      } else {
        setConnectedUi(false);
      }
    }

    function onStatusNotification(event) {
      handleStatusValue(event.target.value, 'notify');
    }

    async function readStatus() {
      if (!statusCharacteristic) {
        log('Cannot read status: not connected.', 'bad');
        return;
      }

      try {
        const value = await statusCharacteristic.readValue();
        handleStatusValue(value, 'manual');
      } catch (error) {
        log(`Status read failed: ${error.message}`, 'bad');
      }
    }

    async function writeMode(mode) {
      if (!modeCharacteristic) {
        log('Cannot send mode: not connected.', 'bad');
        return;
      }

      try {
        const payload = Uint8Array.of(mode);
        await modeCharacteristic.writeValue(payload);
        log(`Sent mode: ${MODE_NAMES[mode] ?? mode}.`, 'good');
      } catch (error) {
        log(`Mode write failed: ${error.message}`, 'bad');
      }
    }

    $('connectButton').addEventListener('click', connectHotSox);
    $('disconnectButton').addEventListener('click', disconnectHotSox);
    $('readStatusButton').addEventListener('click', readStatus);

    document.querySelectorAll('button.mode').forEach((button) => {
      button.addEventListener('click', () => {
        writeMode(Number(button.dataset.mode));
      });
    });

    $('clearLogButton').addEventListener('click', () => {
      $('log').innerHTML = '';
      log('Log cleared.');
    });

    setConnectedUi(false);
    log('App ready. Tap Connect.');
  </script>
</body>
</html>
