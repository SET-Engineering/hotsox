<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HotSox RevA</title>

  <style>
    :root {
      color-scheme: dark;
      --bg0: #060808;
      --panel: #111719;
      --panel2: #0b1012;
      --line: #303a3f;
      --line2: #20292d;
      --orange: #ff8a00;
      --orange2: #b85e00;
      --cyan2: #74e7f1;
      --text: #e6eef0;
      --muted: #7b8a91;
      --danger: #b53620;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Gill Sans", "Gill Sans MT", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      background:
        linear-gradient(rgba(255,138,0,0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,138,0,0.024) 1px, transparent 1px),
        radial-gradient(circle at 12% 0%, rgba(255,138,0,0.12), transparent 34%),
        radial-gradient(circle at 88% 10%, rgba(0,185,208,0.08), transparent 30%),
        var(--bg0);
      background-size: 56px 56px, 56px 56px, auto, auto, auto;
      color: var(--text);
      touch-action: manipulation;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 9px 9px 18px;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 8px 0 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      min-width: 0;
    }

    .logo {
      display: block;
      width: auto;
      height: 45px;
      object-fit: contain;
      margin-top: 0;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.10));
    }

    .brandtext {
      min-height: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
    }

    .brandmain {
      margin: 0;
      color: var(--orange);
      font-size: 14px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      text-shadow: 0 0 16px rgba(255,138,0,0.22);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.20em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: #0b0e10;
      border-radius: 2px;
      color: var(--muted);
      padding: 7px 8px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.09em;
    }

    .pill.on {
      color: var(--cyan2);
      border-color: rgba(0,185,208,0.6);
      box-shadow: 0 0 14px rgba(0,185,208,0.10);
    }

    .pill.err {
      color: #ffb09a;
      border-color: rgba(181,54,32,0.8);
    }

    .panel {
      position: relative;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(255,138,0,0.075), transparent 35%),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }

    .panel::before {
      content: "";
      position: absolute;
      left: -1px;
      top: -1px;
      width: 42%;
      height: 3px;
      background: var(--orange);
      box-shadow: 0 0 12px rgba(255,138,0,0.35);
    }

    .titleline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--orange);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.24em;
    }

    .titleline::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.1fr 0.8fr;
      gap: 7px;
      margin-top: 10px;
    }

    .metric {
      min-width: 0;
      border: 1px solid var(--line2);
      background: var(--panel2);
      padding: 8px 7px;
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .readout {
      margin-top: 3px;
      color: var(--cyan2);
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .readout.orange { color: var(--orange); }
    .readout.danger { color: #ff967c; }

    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #0c1012;
      color: var(--muted);
      min-height: 32px;
      min-width: 42px;
      padding: 7px 9px;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    button:active {
      color: var(--orange);
      border-color: var(--orange2);
      background: #14100a;
      transform: translateY(1px);
    }

    button.primary {
      color: var(--orange);
      border-color: var(--orange2);
    }

    button.cyan {
      color: var(--cyan2);
      border-color: rgba(0,185,208,0.55);
    }

    button.danger {
      color: #ff9c85;
      border-color: rgba(181,54,32,0.8);
      background: rgba(181,54,32,0.13);
    }

    button.small {
      min-width: 31px;
      min-height: 29px;
      padding: 6px 6px;
      font-size: 10px;
    }

    .zones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .zone {
      border: 1px solid var(--line2);
      background: #0b0f11;
      padding: 8px;
      min-width: 0;
    }

    .zone.active {
      border-color: rgba(0,185,208,0.55);
      box-shadow: inset 0 0 0 1px rgba(0,185,208,0.08);
    }

    .zone.hot {
      border-color: rgba(255,138,0,0.65);
      box-shadow: inset 0 0 0 1px rgba(255,138,0,0.08);
    }

    .zonehead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .zonename {
      color: var(--orange);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.17em;
      white-space: nowrap;
    }

    .zoneval {
      color: var(--cyan2);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .zonebuttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .footbuttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    input {
      flex: 1;
      min-width: 110px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #080a0b;
      color: var(--cyan2);
      padding: 7px 8px;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .reply {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rawbox {
      margin-top: 8px;
    }

    .rawtitle {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 5px;
    }

    pre {
      margin: 0;
      height: 58px;
      overflow: hidden;
      white-space: pre;
      word-break: normal;
      color: #9ca8ad;
      font-family: "Consolas", "Menlo", "Roboto Mono", monospace;
      font-size: 8px;
      line-height: 1.35;
    }

    @media (max-width: 420px) {
      .wrap { padding: 8px 8px 14px; }
      .top { grid-template-columns: 1fr; }
      .pill { justify-self: stretch; }
      .logo { height: 43px; }
      .brandtext { min-height: 43px; }
      .brandmain { font-size: 13px; letter-spacing: 0.17em; }
      .sub { font-size: 9px; letter-spacing: 0.15em; }
      .metrics { gap: 5px; }
      .metric { padding: 7px 5px; }
      .readout { font-size: 16px; }
      .zones { gap: 6px; }
      .zone { padding: 7px 6px; }
      .zonename { font-size: 11px; letter-spacing: 0.12em; }
      .zoneval { font-size: 13px; }
      button { min-width: 31px; min-height: 30px; padding: 6px 5px; font-size: 10px; letter-spacing: 0.06em; }
      pre { font-size: 7.5px; }
    }
  </style>
</head>

        <div class="brandtext">
          <div class="brandmain">BLE heat controller</div>
          <div class="sub">RevA prototype</div>
        </div>
      </div>
      <div class="pill" id="conn">Disconnected</div>
    </div>

    <div class="panel">
      <div class="titleline">Link</div>
      <div class="row">
        <button class="primary" onclick="connectHotSox()">Connect</button>
        <button onclick="disconnectHotSox()">Disc</button>
        <button class="danger" onclick="sendCmd('OFF')">Off</button>
        <button onclick="sendCmd('?')">?</button>
      </div>
      <div class="reply" id="reply">--</div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="label">Volt</div><div class="readout" id="busV">--</div></div>
      <div class="metric"><div class="label">Amp</div><div class="readout" id="currentA">--</div></div>
      <div class="metric"><div class="label">Watt</div><div class="readout" id="powerW">--</div></div>
      <div class="metric"><div class="label">Fault</div><div class="readout orange" id="fault">--</div></div>
    </div>

    <div class="panel">
      <div class="titleline">Zones</div>
      <div class="zones">
        <div class="zone" id="zoneLS">
          <div class="zonehead"><div class="zonename">L sole</div><div class="zoneval" id="ls">--</div></div>
          <div class="zonebuttons">
            <button class="small danger" onclick="sendCmd('LS=0')">0</button>
            <button class="small" onclick="sendCmd('SOLO=LS:10')">10</button>
            <button class="small" onclick="sendCmd('SOLO=LS:25')">25</button>
            <button class="small" onclick="sendCmd('SOLO=LS:40')">40</button>
            <button class="small cyan" onclick="sendCmd('SOLO=LS:100')">100</button>
          </div>
        </div>

        <div class="zone" id="zoneLT">
          <div class="zonehead"><div class="zonename">L toe</div><div class="zoneval" id="lt">--</div></div>
          <div class="zonebuttons">
            <button class="small danger" onclick="sendCmd('LT=0')">0</button>
            <button class="small" onclick="sendCmd('SOLO=LT:10')">10</button>
            <button class="small" onclick="sendCmd('SOLO=LT:25')">25</button>
            <button class="small" onclick="sendCmd('SOLO=LT:40')">40</button>
            <button class="small cyan" onclick="sendCmd('SOLO=LT:100')">100</button>
          </div>
        </div>

        <div class="zone" id="zoneRS">
          <div class="zonehead"><div class="zonename">R sole</div><div class="zoneval" id="rs">--</div></div>
          <div class="zonebuttons">
            <button class="small danger" onclick="sendCmd('RS=0')">0</button>
            <button class="small" onclick="sendCmd('SOLO=RS:10')">10</button>
            <button class="small" onclick="sendCmd('SOLO=RS:25')">25</button>
            <button class="small" onclick="sendCmd('SOLO=RS:40')">40</button>
            <button class="small cyan" onclick="sendCmd('SOLO=RS:100')">100</button>
          </div>
        </div>

        <div class="zone" id="zoneRT">
          <div class="zonehead"><div class="zonename">R toe</div><div class="zoneval" id="rt">--</div></div>
          <div class="zonebuttons">
            <button class="small danger" onclick="sendCmd('RT=0')">0</button>
            <button class="small" onclick="sendCmd('SOLO=RT:10')">10</button>
            <button class="small" onclick="sendCmd('SOLO=RT:25')">25</button>
            <button class="small" onclick="sendCmd('SOLO=RT:40')">40</button>
            <button class="small cyan" onclick="sendCmd('SOLO=RT:100')">100</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="titleline">Foot modes</div>
      <div class="footbuttons">
        <button onclick="sendCmd('LEFT=M')">L M</button>
        <button onclick="sendCmd('RIGHT=M')">R M</button>
        <button onclick="sendCmd('ALL=M')">A M</button>
        <button class="cyan" onclick="sendCmd('ALL=H')">A H</button>
        <button onclick="sendCmd('CLEAR')">Clr</button>
      </div>
      <div class="reply">L/R/A = left/right/all. M = maintain. H = high boost.</div>
    </div>

    <div class="panel">
      <div class="titleline">Manual</div>
      <div class="row">
        <input id="cmd" value="?" autocomplete="off" autocapitalize="characters">
        <button onclick="sendManual()">Send</button>
      </div>

      <div class="rawbox">
        <div class="rawtitle">Raw telemetry</div>
        <pre id="raw">--</pre>
      </div>
    </div>
  </div>

<script>
const SERVICE_UUID = "6f4c0001-b5a3-f393-e0a9-e50e24dcca9e";
const CONTROL_UUID = "6f4c0002-b5a3-f393-e0a9-e50e24dcca9e";
const TELEMETRY_UUID = "6f4c0003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let controlChar = null;
let telemetryChar = null;
let rawLines = [];

function el(id) {
  return document.getElementById(id);
}

function setText(id, text) {
  el(id).textContent = text;
}

function setConn(text, cls) {
  const c = el("conn");
  c.textContent = text;
  c.className = "pill" + (cls ? " " + cls : "");
}

async function connectHotSox() {
  try {
    if (!navigator.bluetooth) {
      setConn("No Web BLE", "err");
      setText("raw", "Open this HTTPS page in Chrome on Android.");
      return;
    }

    setConn("Choosing");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "HotSox" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", onDisconnected);

    setConn("Connecting");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    controlChar = await service.getCharacteristic(CONTROL_UUID);
    telemetryChar = await service.getCharacteristic(TELEMETRY_UUID);

    telemetryChar.addEventListener("characteristicvaluechanged", onTelemetry);
    await telemetryChar.startNotifications();

    setConn("Connected", "on");
    await sendCmd("?");
  } catch (err) {
    setConn("Error", "err");
    setText("raw", String(err));
    setText("reply", String(err));
  }
}

function disconnectHotSox() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
}

function onDisconnected() {
  setConn("Disconnected");
  controlChar = null;
  telemetryChar = null;
}

async function sendManual() {
  await sendCmd(el("cmd").value);
}

async function sendCmd(cmd) {
  if (!controlChar) {
    setText("reply", "Not connected");
    return;
  }

  await controlChar.writeValue(new TextEncoder().encode(cmd));
  setText("reply", "sent " + cmd);
}

function onTelemetry(event) {
  const s = new TextDecoder().decode(event.target.value);
  parseTelemetry(s);
}

function parseTelemetry(s) {
  rawLines.push(s);
  rawLines = rawLines.slice(-5);
  setText("raw", rawLines.join("\n"));

  const data = {};
  for (const p of s.split(",")) {
    const eq = p.indexOf("=");
    if (eq > 0) {
      data[p.slice(0, eq)] = p.slice(eq + 1);
    }
  }

  if (data.V !== undefined) setText("busV", fmt(data.V, 2));
  if (data.I !== undefined) setText("currentA", fmt(data.I, 3));
  if (data.P !== undefined) setText("powerW", fmt(data.P, 3));
  if (data.F !== undefined) {
    setText("fault", data.F);
    el("fault").className = data.F === "0" ? "readout orange" : "readout danger";
  }
  if (data.R !== undefined) setText("reply", data.R);

  if (data.D !== undefined || data.M !== undefined) {
    const d = (data.D || "---/---/---/---").split("/");
    const m = (data.M || "-/-/-/-").split("/");

    updateZone("LS", "ls", d[0], m[0]);
    updateZone("LT", "lt", d[1], m[1]);
    updateZone("RS", "rs", d[2], m[2]);
    updateZone("RT", "rt", d[3], m[3]);
  }
}

function fmt(v, n) {
  const x = Number(v);
  if (Number.isNaN(x)) return "--";
  return x.toFixed(n);
}

function updateZone(zoneId, valueId, duty, mode) {
  if (duty === undefined) duty = "---";
  if (mode === undefined) mode = "-";

  const dNum = Number(duty);
  setText(valueId, duty + " " + mode);

  const z = el("zone" + zoneId);
  z.className = "zone";
  if (!Number.isNaN(dNum) && dNum > 0) {
    z.classList.add(dNum >= 40 ? "hot" : "active");
  }
}

if (!navigator.bluetooth) {
  setConn("No Web BLE", "err");
  setText("raw", "Use Chrome on Android and load this page from HTTPS.");
}
</script>
